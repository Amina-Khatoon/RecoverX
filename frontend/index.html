<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RecoverX | Recovery Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: #f8fafc;
            background:
                radial-gradient(circle at 10% 10%, rgba(59,130,246,.15), transparent 28%),
                radial-gradient(circle at 90% 90%, rgba(34,211,238,.10), transparent 30%),
                #07111f;
            padding: 30px 18px;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -1.5px;
        }

        .logo span {
            color: #22d3ee;
        }

        .subtitle {
            color: #94a3b8;
            margin-top: 8px;
            font-size: 14px;
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 18px;
        }

        .nav a {
            text-decoration: none;
            color: #cbd5e1;
            border: 1px solid rgba(148,163,184,.18);
            background: rgba(255,255,255,.04);
            padding: 9px 15px;
            border-radius: 10px;
            font-size: 13px;
        }

        .nav a:hover,
        .nav a.active {
            background: rgba(59,130,246,.16);
            border-color: rgba(59,130,246,.35);
            color: white;
        }

        .card {
            background: rgba(13,27,45,.88);
            border: 1px solid rgba(148,163,184,.15);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .section-title {
            margin: 0;
            font-size: 18px;
        }

        .section-description {
            color: #94a3b8;
            font-size: 12px;
            margin: 6px 0 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 17px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border-radius: 10px;
            border: 1px solid rgba(148,163,184,.18);
            background: #091525;
            color: white;
            outline: none;
            font-size: 13px;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.10);
        }

        .button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            background: linear-gradient(90deg, #2563eb, #06b6d4);
            transition: .2s;
        }

        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 30px rgba(37,99,235,.25);
        }

        #result {
            margin-top: 22px;
        }

        .prediction-result {
            padding: 22px;
            border-radius: 16px;
            background: rgba(34,211,238,.06);
            border: 1px solid rgba(34,211,238,.18);
        }

        .prediction-result h2 {
            margin-top: 0;
        }

        .prediction-result p {
            color: #cbd5e1;
            margin: 11px 0;
        }

        .error {
            padding: 15px;
            border-radius: 12px;
            background: rgba(251,113,133,.08);
            border: 1px solid rgba(251,113,133,.18);
            color: #fda4af;
        }

        .footer {
            text-align: center;
            color: #475569;
            font-size: 11px;
            margin-top: 25px;
        }

        @media (max-width: 850px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            body {
                padding: 18px 12px;
            }

            .card {
                padding: 18px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            Recover<span>X</span>
        </div>

        <div class="subtitle">
            AI-Powered Recovery Prediction & Decision Support System
        </div>

        <div class="nav">
            <a href="index.html" class="active">✨ Prediction</a>
            <a href="dashboard.html">📊 Dashboard</a>
        </div>

    </div>

    <div class="card">

        <h2 class="section-title">
            Recovery Prediction
        </h2>

        <p class="section-description">
            Enter case and financial information to generate an AI-based recovery prediction.
        </p>

        <form id="predictionForm">

            <div class="form-grid">

                <div class="field">
                    <label for="case_id">Case ID</label>
                    <input type="number" id="case_id" value="1" required>
                </div>

                <div class="field">
                    <label for="amount_due">Amount Due</label>
                    <input type="number" id="amount_due" value="5000" required>
                </div>

                <div class="field">
                    <label for="days_overdue">Days Overdue</label>
                    <input type="number" id="days_overdue" value="30" required>
                </div>

                <div class="field">
                    <label for="monthly_income">Monthly Income</label>
                    <input type="number" id="monthly_income" value="30000" required>
                </div>

                <div class="field">
                    <label for="monthly_expense">Monthly Expense</label>
                    <input type="number" id="monthly_expense" value="15000" required>
                </div>

                <div class="field">
                    <label for="payment_history_score">Payment History Score</label>
                    <input type="number" id="payment_history_score" value="80" required>
                </div>

                <div class="field">
                    <label for="missed_payments">Missed Payments</label>
                    <input type="number" id="missed_payments" value="2" required>
                </div>

                <div class="field">
                    <label for="previous_recovery_rate">Previous Recovery Rate</label>
                    <input type="number" step="0.01" id="previous_recovery_rate" value="0.5" required>
                </div>

                <div class="field">
                    <label for="contact_success_rate">Contact Success Rate</label>
                    <input type="number" step="0.01" id="contact_success_rate" value="0.6" required>
                </div>

                <div class="field">
                    <label for="last_payment_days_ago">Last Payment Days Ago</label>
                    <input type="number" id="last_payment_days_ago" value="20" required>
                </div>

                <div class="field">
                    <label for="account_age_days">Account Age Days</label>
                    <input type="number" id="account_age_days" value="500" required>
                </div>

                <div class="field">
                    <label for="reminders_received">Reminders Received</label>
                    <input type="number" id="reminders_received" value="3" required>
                </div>

                <div class="field">
                    <label for="digital_engagement">Digital Engagement</label>
                    <input type="number" step="0.01" id="digital_engagement" value="0.7" required>
                </div>

                <div class="field">
                    <label for="hardship_flag">Hardship Flag</label>
                    <input type="number" id="hardship_flag" value="0" min="0" max="1" required>
                </div>

                <div class="field">
                    <label for="recovery_days">Recovery Days</label>
                    <input type="number" id="recovery_days" value="30" required>
                </div>

            </div>

            <button class="button" type="submit">
                ✨ Predict Recovery
            </button>

        </form>

        <div id="result"></div>

    </div>

    <div class="footer">
        RecoverX • AI Recovery Prediction & Decision Support System
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
