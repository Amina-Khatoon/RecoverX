<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RecoverX - Recovery Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
        }

        .prediction-result {
            padding: 20px;
            background: #eef6ff;
            border-radius: 10px;
        }

        .prediction-result p {
            font-size: 16px;
            margin: 10px 0;
        }

        .error {
            padding: 15px;
            background: #ffe5e5;
            color: #b91c1c;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>RecoverX</h1>

    <div class="subtitle">
        Recovery Prediction System
    </div>

    <form id="predictionForm">

        <div class="form-grid">

            <div class="field">
                <label for="case_id">Case ID</label>
                <input type="number" id="case_id" value="1" required>
            </div>

            <div class="field">
                <label for="amount_due">Amount Due</label>
                <input type="number" id="amount_due" value="5000" required>
            </div>

            <div class="field">
                <label for="days_overdue">Days Overdue</label>
                <input type="number" id="days_overdue" value="30" required>
            </div>

            <div class="field">
                <label for="monthly_income">Monthly Income</label>
                <input type="number" id="monthly_income" value="30000" required>
            </div>

            <div class="field">
                <label for="monthly_expense">Monthly Expense</label>
                <input type="number" id="monthly_expense" value="15000" required>
            </div>

            <div class="field">
                <label for="payment_history_score">Payment History Score</label>
                <input type="number" id="payment_history_score" value="80" required>
            </div>

            <div class="field">
                <label for="missed_payments">Missed Payments</label>
                <input type="number" id="missed_payments" value="2" required>
            </div>

            <div class="field">
                <label for="previous_recovery_rate">Previous Recovery Rate</label>
                <input type="number" step="0.01" id="previous_recovery_rate" value="0.5" required>
            </div>

            <div class="field">
                <label for="contact_success_rate">Contact Success Rate</label>
                <input type="number" step="0.01" id="contact_success_rate" value="0.6" required>
            </div>

            <div class="field">
                <label for="last_payment_days_ago">Last Payment Days Ago</label>
                <input type="number" id="last_payment_days_ago" value="20" required>
            </div>

            <div class="field">
                <label for="account_age_days">Account Age Days</label>
                <input type="number" id="account_age_days" value="500" required>
            </div>

            <div class="field">
                <label for="reminders_received">Reminders Received</label>
                <input type="number" id="reminders_received" value="3" required>
            </div>

            <div class="field">
                <label for="digital_engagement">Digital Engagement</label>
                <input type="number" step="0.01" id="digital_engagement" value="0.7" required>
            </div>

            <div class="field">
                <label for="hardship_flag">Hardship Flag</label>
                <input type="number" id="hardship_flag" value="0" min="0" max="1" required>
            </div>

            <div class="field">
                <label for="recovery_days">Recovery Days</label>
                <input type="number" id="recovery_days" value="30" required>
            </div>

        </div>

        <button type="submit">
            Predict Recovery
        </button>

    </form>

    <div id="result"></div>

</div>

<script src="script.js"></script>

</body>
</html>
